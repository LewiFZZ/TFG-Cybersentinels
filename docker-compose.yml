name: urlsentinel

# URLSentinel: análisis de URLs para detectar phishing, 100 % local.
# Arranque:  cp .env.example .env   (y cambia DB_PASSWORD)
#            docker compose up -d
# Abrir:     http://localhost:8080

services:
  app:
    image: ghcr.io/lewifzz/urlsentinel:${URLSENTINEL_VERSION:-latest}
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-urlsentinel}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      DB_NAME: ${DB_NAME:-urlsentinel}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-60}
      # Reputación externa (opcional): sin API key, la fuente no se consulta.
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      GOOGLE_SAFE_BROWSING_API_KEY: ${GOOGLE_SAFE_BROWSING_API_KEY:-}
      REPUTATION_TIMEOUT_MS: ${REPUTATION_TIMEOUT_MS:-4000}
      REPUTATION_CACHE_HOURS: ${REPUTATION_CACHE_HOURS:-24}
    ports:
      # Por defecto solo accesible desde este equipo (no hay login).
      # Para exponerlo en la red local: HTTP_BIND=0.0.0.0 en .env
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: ${DB_USER:-urlsentinel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      POSTGRES_DB: ${DB_NAME:-urlsentinel}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./database/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./database/postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    # Sin puertos publicados: solo la app llega a la base de datos.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
