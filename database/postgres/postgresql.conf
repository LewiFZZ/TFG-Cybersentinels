# ------------------------------------------------------------------
# PostgreSQL 18 - URLSentinel
# Ajustado para un VPS pequeño (~2 vCPU / 2-4 GB RAM) con carga OLTP
# ligera (API REST). Revisar si cambia el tamaño de la máquina.
# ------------------------------------------------------------------
listen_addresses = '*'
max_connections = 50              # el backend usa un pool (DB_POOL_MAX)

# --- Memoria ---
shared_buffers = 512MB            # ~25% RAM
effective_cache_size = 1536MB     # ~75% RAM (estimación para el planner)
work_mem = 8MB                    # por operación de sort/hash
maintenance_work_mem = 128MB      # VACUUM / CREATE INDEX
huge_pages = try

# --- Planner (almacenamiento SSD) ---
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# --- WAL / checkpoints ---
wal_level = replica
wal_compression = lz4
wal_buffers = 16MB
min_wal_size = 256MB
max_wal_size = 2GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# --- Paralelismo ---
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# --- Autovacuum (tablas con muchas inserciones: análisis, logs) ---
autovacuum = on
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_insert_scale_factor = 0.1

# --- JSONB / TOAST ---
default_toast_compression = lz4

# --- Seguridad ---
password_encryption = scram-sha-256
idle_in_transaction_session_timeout = 60s

# --- Observabilidad ---
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = top
pg_stat_statements.max = 5000
track_io_timing = on
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 1s
log_line_prefix = '%m [%p] %q%u@%d '

timezone = 'UTC'
log_timezone = 'UTC'
